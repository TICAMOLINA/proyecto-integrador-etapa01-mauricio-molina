<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosotros</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
</head>

<body>
  <header class="main-header">
    <input type="checkbox" id="menu">
    <nav class="nav-bar">
      <ul class="nav-bar__nav-list">
        <li class="nav-bar__nav-item">
          <a href="../../../index.html" class="nav-bar__nav-link">Inicio</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="" class="nav-bar__nav-link">Alta</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="../about/about.html" class="nav-bar__nav-link">Nosotros</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="contact.html" class="nav-bar__nav-link">Contacto</a>
        </li>
      </ul>
    </nav> <!-- .nav-bar-->

    <div class="search-bar">
      <div class="search-bar__logo-container">
        <img class="search-bar__logo-image" src="../../../imgs/logo1.webp" alt="logo de la pagina">
      </div>
      <form action="" class="search-bar__form-container">
        <label for="busqueda" class="search-bar__form-label">Buscar</label>
        <input type="search" id="busqueda" class="search-bar__form-search" placeholder="BUSCAR...">
        <button type="submit" class="search-bar__form-submit"><i class="fa fa-search"></i></button>
      </form>
      <div class="search-bar__carrito-container">
        <img class="search-bar__image-carrito" src="../../../imgs/shopping-bag.webp" alt="">
      </div>
      <div class="menu-toogle">
        <label for="menu" class="menu-toogle__label">
          <span class="menu-toogle__top-bread"></span>
          <span class="menu-toogle__meat"></span>
          <span class="menu-toogle__bottom-bread"></span>
        </label>
      </div> <!-- .menu-toogle -->
    </div> <!-- .search-bar-->

  </header>

  <main class="contact-page">

    <div class="contact-page__tittle">
      <h1>Contáctenos</h1>
    </div>

    <section class="contact-section">
        <article class="contact-section__location-container">
          <div class="contact-section__location-icon-container">
            <img class="contact-section__image-location" src="" alt="">
          </div>
            <h2>Vení a nuestra sucursal</h2>
            <div class="contact-section__map-location"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3263.22349719539!2d-106.53681809999999!3d35.1260958!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87227557938908eb%3A0x723dd3cf63dbb051!2s3828%20Piermont%20Dr%20NE%2C%20Albuquerque%2C%20NM%2087111%2C%20EE.%20UU.!5e0!3m2!1ses-419!2sar!4v1739363060060!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" frameborder="0"></iframe></div>
            <div class="contact-section__text">
              <p><i class="fa fa-phone" aria-hidden="true"></i>123-4567-8910</p>
              <p><i class="fa fa-envelope" aria-hidden="true"></i>sarasa@mail.com</p>
              <p><i class="fa fa-location-arrow" aria-hidden="true"></i>Negra Arroyo Lane 308 - Albuquerque</p>
            </div>
        </article>
      </section>

      <article class="contact-section__contact-container">
        <div class="contact-section__message-icon-container">
          <img class="contact-section__image-message"  src="" alt="">
        </div>
          <h2>Escríbenos</h2>
          <div>
            <form class="contact-section__form-container" action="">
              <div class="contact-section__name-user"><label for="">Nombre</label><input type="text">Nombre</div>
              <div class="contact-section__mail-user"><label for="">Email</label><input type="text">Email</div>
              <div class="contact-section__text-area-user"><label for="">Escriba su mensaje</label><input type="text">Escriba</div>
              <div class="contact-section__submit">
                <button>Enviar Mensaje</button>
              </div>
            </form>
          </div>
      </article>
  </main>


  <footer class="footer-container">
    <div class="footer-container__footer-logo">
      <div class="footer-container__logo-facebook"><i class="fab fa-facebook" aria-hidden="true"></i></div>
      <div class="footer-container__logo-instagram"><i class="fab fa-instagram" aria-hidden="true"></i></div>
      <div class="footer-container__logo-whatsapp"><i class="fab fa-whatsapp" aria-hidden="true"></i></div>
      <div class="footer-container__logo-twitter"><i class="fab fa-twitter" aria-hidden="true"></i></div>
    </div>
    <div class="footer-container__footer-text">
      <p>® Copyright 2025 - Todos los derechos reservados</p>
    </div>

  </footer>

  <script type="module" src="./contact.js"></script>
  </main>
</body>

</html>
