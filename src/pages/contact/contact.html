<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosotros</title>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
</head>

<body>
  <header class="main-header">
    <input type="checkbox" id="menu">
    <nav class="nav-bar">
      <ul class="nav-bar__nav-list">
        <li class="nav-bar__nav-item">
          <a href="../../../index.html" class="nav-bar__nav-link">Inicio</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="" class="nav-bar__nav-link">Alta</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="../about/about.html" class="nav-bar__nav-link">Nosotros</a>
        </li>
        <li class="nav-bar__nav-item">
          <a href="contact.html" class="nav-bar__nav-link">Contacto</a>
        </li>
      </ul>
    </nav> <!-- .nav-bar-->

    <div class="search-bar">
      <div class="search-bar__logo-container">
        <img class="search-bar__logo-image" src="../../../imgs/logo1.webp" alt="logo de la pagina">
      </div>
      <form action="" class="search-bar__form-container">
        <label for="busqueda" class="search-bar__form-label">Buscar</label>
        <input type="search" id="busqueda" class="search-bar__form-search" placeholder="BUSCAR...">
        <button type="submit" class="search-bar__form-submit"><i class="fa fa-search"></i></button>
      </form>
      <div class="search-bar__carrito-container">
        <img class="search-bar__image-carrito" src="../../../imgs/shopping-bag.webp" alt="">
      </div>
      <div class="menu-toogle">
        <label for="menu" class="menu-toogle__label">
          <span class="menu-toogle__top-bread"></span>
          <span class="menu-toogle__meat"></span>
          <span class="menu-toogle__bottom-bread"></span>
        </label>
      </div> <!-- .menu-toogle -->
    </div> <!-- .search-bar-->

  </header>


    <script type="module" src="./contact.js"></script>
  </main>
</body>

</html>
